version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deployos-postgres
    environment:
      POSTGRES_DB: deployos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deployos-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: deployos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/deployos
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    container_name: deployos-dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
