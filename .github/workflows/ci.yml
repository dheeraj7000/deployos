name: DeployOS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Deterministic Unit & Policy Tests
        run: |
          pytest tests/ -v

      - name: Run Master Reliability & Security Benchmark Suite
        run: |
          deployos eval --suite master --model mock-reliable-v1

      - name: Run Chaos Engineering Verification
        run: |
          deployos chaos prompt-injection
          deployos chaos api-timeout
          deployos chaos stale-data
          deployos chaos duplicate-webhook

      - name: Build Next.js Dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
