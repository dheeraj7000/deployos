[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployos"
version = "0.1.0"
description = "A Reliability, Execution, and Evaluation Platform for Production AI Agents"
readme = "README.md"
authors = [{ name = "DeployOS Engineering Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "temporalio>=1.5.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
deployos = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*", "workflows*", "cli*", "evals*"]
